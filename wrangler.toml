name = "emailing"
compatibility_date = "2026-08-20"


[assets]
directory = "./public"
# Optional – uncomment only if you have real Worker logic that needs the assets binding:
# binding = "ASSETS"
# not_found_handling = "single-page-application"
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
